# Dependency definition for the ExG + Otsu segmentation baseline.
#
# Managed with uv (conda is not used):
#
#   uv sync

[project]
name = "foresplat-exg-otsu"
version = "0.0.0"
description = "ExG + Otsu foreground segmentation baseline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8,<5",
]

[tool.uv]
package = false
