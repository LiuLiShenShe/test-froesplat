shared:
  iterations: 30000
  sh_degree: 0
  sg_degree: 0
  resolution: 2
  seed: 0
  optimizer:
    position_lr_init: 0.00016
    position_lr_final: 1.6e-06
    feature_dc_lr: 0.0013
    feature_rest_lr: 0.00011
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001
    sg_axis_lr: 0.002
    sg_sharpness_lr: 0.095
    sg_color: 0.00064
  densification:
    densify_from_iter: 500
    densify_until_iter: 15000
    densification_interval: 100
    opacity_reset_interval: 3000
    densify_grad_threshold: 0.0002
    opacity_cull: 0.05
  losses:
    lambda_dssim: 0.2
    lambda_depth_normal: 0.05
    lambda_multi_view_ncc: 0.6
    lambda_multi_view_geo: 0.02
    regularization_from_iter: 7000
  initial_num_gaussians: 1252383
experiments:
- id: E1_GGGS_Baseline
  exposure_compensation: false
  foreground_constraints: false
  flags: []
- id: E2_GGGS_EO
  exposure_compensation: true
  foreground_constraints: false
  flags:
  - --enable_eo
- id: E3_GGGS_Foreground
  exposure_compensation: false
  foreground_constraints: true
  flags:
  - --use_foreground_rgb_loss
  - --foreground_rgb_crop_padding
  - '12'
  - --use_mask_loss
  - --use_bg_opacity_loss
  - --lambda_mask
  - '0.08'
  - --lambda_bg
  - '0.02'
  - --mask_loss_type
  - l1_dice
  - --mask_ignore_boundary_px
  - '2'
  - --mask_loss_start_iter
  - '500'
  - --mask_loss_warmup_iters
  - '1500'
  - --pruning_mode
  - mask
  - --pruning_start_iter
  - '18000'
  - --pruning_interval
  - '3000'
  - --pruning_opacity_threshold
  - '0.005'
  - --pruning_brightness_threshold
  - '0.01'
  - --pruning_mask_threshold
  - '0.45'
  - --pruning_mask_max_views
  - '12'
  - --pruning_max_remove_ratio
  - '0.03'
  - --pruning_mask_score_weight
  - '3.0'
  - --save_pruning_report
- id: E4_ForeSplat_GGGS
  exposure_compensation: true
  foreground_constraints: true
  flags:
  - --enable_eo
  - --use_foreground_rgb_loss
  - --foreground_rgb_crop_padding
  - '12'
  - --use_mask_loss
  - --use_bg_opacity_loss
  - --lambda_mask
  - '0.08'
  - --lambda_bg
  - '0.02'
  - --mask_loss_type
  - l1_dice
  - --mask_ignore_boundary_px
  - '2'
  - --mask_loss_start_iter
  - '500'
  - --mask_loss_warmup_iters
  - '1500'
  - --pruning_mode
  - mask
  - --pruning_start_iter
  - '18000'
  - --pruning_interval
  - '3000'
  - --pruning_opacity_threshold
  - '0.005'
  - --pruning_brightness_threshold
  - '0.01'
  - --pruning_mask_threshold
  - '0.45'
  - --pruning_mask_max_views
  - '12'
  - --pruning_max_remove_ratio
  - '0.03'
  - --pruning_mask_score_weight
  - '3.0'
  - --save_pruning_report
