[project]
name = "vggt-omega"
version = "0.0.2"
description = "VGGT-Omega feed-forward camera and depth reconstruction (fork with CPU support, COLMAP export, and GLB improvements)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"},
]
dependencies = [
    "numpy<2",
    "Pillow",
    "einops",
    "safetensors",
    "opencv-python",
]

[project.optional-dependencies]
demo = [
    "gradio>=5.17.1",
    "viser>=0.2.23",
    "tqdm",
    "scipy",
    "trimesh",
    "matplotlib",
    "requests",
    "onnxruntime",
]
export = [
    "pycolmap>=3.10.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Do not let `uv pip install <something>` silently upgrade torch: the GGGS CUDA
# extensions (diff_gaussian_rasterization) are compiled against this exact
# version and will fail with undefined c10 symbols if torch drifts.
[tool.uv]
constraint-dependencies = ["torch==2.10.0", "torchvision==0.25.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt_omega*"]
