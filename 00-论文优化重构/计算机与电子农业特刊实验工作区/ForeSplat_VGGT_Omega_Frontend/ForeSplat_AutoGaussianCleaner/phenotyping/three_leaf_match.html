<!doctype html>
<meta charset="utf-8"><link rel="icon" href="data:,">
<title>ForeSplat · 57 片标定叶片匹配</title>
<style>
body{font:15px system-ui,-apple-system,sans-serif;background:#f3f7f5;color:#17372d;margin:0}
header{padding:16px 24px;background:#104c3b;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wrap{max-width:2200px;margin:0 auto;padding:10px 14px 28px}.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px;margin-bottom:12px}.plant-progress{background:#fff;border:1px solid #d5e2dc;border-radius:6px;padding:7px 9px;min-width:0}.plant-progress>a{color:#145b43;text-decoration:none}.plant-progress .slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.slot{font-size:12px;color:#55665f;background:#f0f4f2;border-radius:4px;padding:3px 5px}.slot.confirmed{color:#08643d;background:#dff3e7}.workspace{display:grid;grid-template-columns:minmax(420px,0.95fr) minmax(520px,1.05fr);gap:12px;align-items:start}.panel{min-width:0;background:#fff;border:1px solid #d5e2dc;border-radius:8px;padding:12px;box-shadow:0 1px 4px #18392b12}.panel h2{margin:4px 0 12px;font-size:19px}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0}.toolbar input{max-width:150px}button,select,input,textarea{font:inherit}button{border:1px solid #aebfb7;border-radius:5px;background:#f7faf8;padding:6px 10px;cursor:pointer;color:#17372d}button:hover{background:#e5f2eb}.primary{background:#14734f;color:#fff;border-color:#14734f}.primary:hover{background:#0d5f3f}.warn{color:#8b2c20}.image-stage{height:min(72vh,820px)}.mesh-frame{display:block;background:#f7faf8}
.image-stage{position:relative;display:block;line-height:0;width:100%;height:min(72vh,820px);background:#151c1a;overflow:auto}.image-stage img{display:block;max-width:none;height:auto}.image-stage #mask{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.48;pointer-events:none;mix-blend-mode:screen}.image-stage #click-dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #ff562e;display:none;transform:translate(-50%,-50%);pointer-events:none}.hint{color:#52665d;font-size:13px}.candidates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;margin-top:10px}.candidate{border:1px solid #b6c8c0;border-radius:6px;padding:8px;background:#f9fcfa}.candidate.selected{border:2px solid #0e7253;background:#eaf8f0}.candidate button{width:100%;margin-top:5px}.mesh-frame{width:100%;height:480px;border:1px solid #d4e0db;border-radius:5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{background:#f4f8f6;padding:8px;border-radius:5px}.metric b{display:block;font-size:18px}.history{max-height:280px;overflow:auto;border:1px solid #d4e0db}.history table{width:100%;border-collapse:collapse;font-size:13px}.history th,.history td{border-bottom:1px solid #dbe6e1;padding:6px;text-align:left}.history tr.selected{background:#e2f4eb}.raw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:5px;margin:8px 0}.raw-field{display:flex;justify-content:space-between;gap:8px;padding:5px;background:#f5f8f6;border-radius:4px}.raw-field b{font-weight:600}.metric-suggestions{margin-top:8px;border:1px solid #d4e0db;border-radius:5px;padding:8px;background:#fbfdfc}.metric-suggestions .suggestion{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px;border-bottom:1px solid #e2ebe6}.metric-suggestions .suggestion:last-child{border-bottom:0}.notes{width:100%;box-sizing:border-box;min-height:55px}.status{white-space:pre-wrap;padding:8px;background:#eef5f1;border-radius:5px;margin:8px 0}.status.error{background:#fff0ed;color:#8b2c20}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.mesh-frame{height:400px}}
</style>
<style>#image-canvas{position:relative;width:100%;height:auto}#image-stage img#rgb{width:100%;max-width:none}#image-stage #mask{inset:0 auto auto 0;width:100%;height:auto;object-fit:fill}</style>
<header><h1>ForeSplat · 57 片人工标定叶片</h1><label>植株 <select id="plant"></select></label><label>RGB 视角 <select id="view"></select></label><a href="/summary/three_leaf_match_overview.html" style="color:#fff">19 株进度</a><a href="/review" style="color:#fff">原有人工录入</a></header>
<div class="wrap"><div id="progress" class="progress"></div><div class="workspace">
<section class="panel"><h2>左侧：原始 RGB 点击编号叶片</h2><div class="toolbar"><b>当前编号：</b><button class="number" data-number="1">1</button><button class="number" data-number="2">2</button><button class="number" data-number="3">3</button><button id="zoom-out">缩小</button><button id="zoom-reset">原始比例</button><button id="zoom-in">放大</button><span id="current-status" class="hint"></span></div><div id="image-stage" class="image-stage"><div id="image-canvas" class="image-canvas"><img id="rgb"><img id="mask"><span id="click-dot"></span></div></div><p class="hint">请在原始照片中点击手写编号对应的叶片表面。程序只读取投影缓存，不做 OCR；直接命中和附近候选都会列出，不会自动确认。</p><div id="candidates" class="candidates"></div></section>
<section class="panel"><h2>右侧：Leaf_NNN 三维核对</h2><div id="leaf-status" class="status">请先选择编号并点击照片。</div><iframe id="mesh" class="mesh-frame" title="独立厘米叶片 Mesh"></iframe><div id="metrics" class="metrics"></div><p><a id="ply" download>下载厘米 PLY</a> · <a id="reference" target="_blank">打开 RGB 参考图</a> · <a id="sam" target="_blank">SAM3 修正当前叶片</a></p><h3>历史 Excel 候选</h3><p class="hint">同品种多株时必须由你选择 Excel 行；页面不会按品种自动认定具体植株。</p><div id="history" class="history"></div><div id="metric-suggestions" class="metric-suggestions"><b>尺寸匹配候选</b><p class="hint">选择历史 Excel 行后，按叶长/叶宽相似度排序；仅作候选，不代表身份确认。</p></div><div class="toolbar"><label>采集批次/时间 <input id="capture_session"></label><label>人工测量日期 <input id="measured_at"></label><label>测量工具 <input id="measurement_tool"></label><label>测量人 <input id="operator"></label></div><label>备注<textarea id="notes" class="notes"></textarea></label><div class="toolbar"><button id="confirm" class="primary">确认对应并保存</button><button id="candidate-select">换一个候选</button><button id="not-found" class="warn">未找到对应叶片</button><button id="cancel">取消当前确认</button></div><div id="save-status" class="status"></div></section></div></div>
<script>
const $=id=>document.getElementById(id); let state={plant:'',view:'',number:1,config:null,clicked:null,selectedLeaf:'',history:null,zoom:1};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,opt){let r=await fetch(url,opt),v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v}
async function loadPlants(){let d=await json('/api/match/plants');$('plant').replaceChildren(...d.plants.map(p=>new Option(p.plant+' · '+p.group,p.plant)));let q=new URLSearchParams(location.search),requested=q.get('plant');state.plant=d.plants.some(p=>p.plant===requested)?requested:(d.plants[0]?.plant||'');state.number=['1','2','3'].includes(q.get('number'))?Number(q.get('number')):1;$('plant').value=state.plant;await loadPlant();let requestedView=q.get('view');if(requestedView&&state.config.views.some(v=>v.view===requestedView)){$('view').value=requestedView;state.view=requestedView;await loadView()}}
async function loadPlant(){if(!state.plant)return;let d=await json('/api/match/config?plant='+encodeURIComponent(state.plant)+'&number='+state.number);state.config=d;let old=state.view;state.view=old&&d.views.some(v=>v.view===old)?old:(d.views.find(v=>v.recommended)?.view||d.views[0]?.view||'');$('view').replaceChildren(...d.views.map(v=>new Option(v.view+(v.recommended?' · 有稳定叶参考':'') ,v.view)));$('view').value=state.view;renderProgress(d.all_rows);renderCurrentRow();await loadView()}
async function loadView(){if(!state.view)return;let d=await json('/api/match/config?plant='+encodeURIComponent(state.plant)+'&view='+encodeURIComponent(state.view)+'&number='+state.number);state.config=d;state.clicked=null;state.selectedLeaf=d.row.leaf_id||'';let row=d.row;$('rgb').src='/api/match/rgb?plant='+encodeURIComponent(state.plant)+'&view='+encodeURIComponent(state.view);$('mask').removeAttribute('src');$('click-dot').style.display='none';$('current-status').textContent=`${state.plant} · ${state.number}号 · ${row.match_status}`;applyZoom();renderCurrentRow();if(state.selectedLeaf)await showLeaf(state.selectedLeaf);else clearLeaf()}
function applyZoom(){$('image-canvas').style.width=(100*state.zoom)+'%'}
function renderProgress(rows){let groups={};for(const r of rows)(groups[r.plant_id]??=[]).push(r);$('progress').innerHTML=Object.entries(groups).map(([p,rs])=>`<div class="plant-progress"><a href="#" data-plant="${esc(p)}"><b>${esc(p)}</b></a><span> ${rs.filter(r=>r.human_confirmed==='True').length}/3</span><div class="slots">${rs.map(r=>`<span class="slot ${esc(r.match_status)}">${r.handwritten_number}: ${esc(r.leaf_id||r.match_status)}</span>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-plant]').forEach(a=>a.onclick=e=>{e.preventDefault();state.plant=a.dataset.plant;loadPlant()})}
function renderCurrentRow(){let row=state.config?.row||{};$('current-status').textContent=`${state.plant} · ${state.number}号 · ${row.match_status||'pending'}`;if(row.clicked_pixel_x){let x=Number(row.clicked_pixel_x),y=Number(row.clicked_pixel_y),im=$('rgb');if(im.naturalWidth){let r=im.getBoundingClientRect(),c=$('image-canvas').getBoundingClientRect();$('click-dot').style.left=(r.left-c.left+x/im.naturalWidth*r.width)+'px';$('click-dot').style.top=(r.top-c.top+y/im.naturalHeight*r.height)+'px';$('click-dot').style.display='block'}}}
function clearLeaf(){state.selectedLeaf='';$('leaf-status').textContent='尚未选择 Leaf_NNN。';$('metrics').innerHTML='';$('mesh').src='about:blank';$('ply').removeAttribute('href');$('reference').removeAttribute('href');$('sam').removeAttribute('href');$('history').innerHTML='';}
async function showLeaf(leaf){state.selectedLeaf=leaf;let d=await json('/api/match/leaf?plant='+encodeURIComponent(state.plant)+'&leaf_id='+encodeURIComponent(leaf)+'&view='+encodeURIComponent(state.view));let m=d.measurement||{};$('leaf-status').textContent=`${leaf} · ${d.faces} faces · ${d.views.length} views`;$('mesh').src=d.mesh_url;$('ply').href=d.ply_url;$('reference').href=d.reference_url;$('sam').href='/annotation?plant='+encodeURIComponent(state.plant)+'&leaf_id='+encodeURIComponent(leaf)+'&view='+encodeURIComponent(state.view);$('metrics').innerHTML=[['叶长',m.leaf_length_cm,'cm'],['叶宽',m.leaf_width_cm,'cm'],['观测单侧面积',m.leaf_area_cm2,'cm²']].map(a=>`<div class="metric"><b>${a[1]||'—'}</b>${a[0]} (${a[2]})</div>`).join('');if(d.mask_url)$('mask').src=d.mask_url;else $('mask').removeAttribute('src');await loadHistory()}
async function loadMetricCandidates(history){
 const box=$('metric-suggestions');
 if(!history){box.innerHTML='<b>尺寸匹配候选</b><p class="hint">先选择一条历史 Excel 行。排序只缩小候选范围，不代表身份确认。</p>';return}
 box.innerHTML='<b>尺寸匹配候选 · '+esc(history.history_row_id)+' · '+esc(history.historical_matching_status||'未验证样本')+'</b><p class="hint">按人工叶长/叶宽与现有 Mesh 自动尺寸排序；自动几何可能不完整，历史记录也可能属于同品种另一株。</p><span class="hint">正在排序…</span>';
 try{
  let d=await json('/api/match/metric-candidates?plant='+encodeURIComponent(state.plant)+'&number='+state.number+'&history_row_id='+encodeURIComponent(history.history_row_id));
  const entries=d.candidates||[];
  box.innerHTML='<b>尺寸匹配候选 · '+esc(history.history_row_id)+' · '+esc(history.historical_matching_status||'未验证样本')+'</b><p class="hint">'+esc(d.warning||'')+'</p>'+
   (entries.length?entries.map(c=>'<div class="suggestion"><b>#'+c.rank+' '+esc(c.leaf_id)+'</b><span>叶长 '+esc(c.automatic_leaf_length_cm||'—')+' / '+esc(c.manual_leaf_length_cm||'—')+' cm</span><span>叶宽 '+esc(c.automatic_leaf_width_cm||'—')+' / '+esc(c.manual_leaf_width_cm||'—')+' cm</span><span>相对差 '+(100*c.mean_relative_error).toFixed(1)+'% · '+c.traits_compared+'/2 个性状 · '+esc(c.measurement_status||'')+'</span><button data-metric-leaf="'+esc(c.leaf_id)+'">查看这个候选</button></div>').join(''):'<p class="hint">此叶片或历史槽位没有可比较的自动尺寸。</p>');
  document.querySelectorAll('[data-metric-leaf]').forEach(b=>b.onclick=()=>showLeaf(b.dataset.metricLeaf));
 }catch(e){box.innerHTML='<b>尺寸匹配候选</b><p class="hint">排序失败：'+esc(e.message)+'</p>'}
}
async function loadHistory(){
 let previous=selectedHistory()?.history_row_id||state.config.row.history_row_id||'';
 let d=await json('/api/match/history?plant='+encodeURIComponent(state.plant)+'&number='+state.number);state.history=d.candidates||[];
 let row=state.config.row;for(const key of ['capture_session','measured_at','measurement_tool','operator'])$(key).value=row[key]||'';
 const raw=r=>Object.entries(r.all_values||{}).map(([k,v])=>'<div class="raw-field"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>').join('');
 $('history').innerHTML=state.history.length?'<table><tr><th>选择</th><th>Excel 行</th><th>品种</th><th>叶长真值</th><th>叶宽真值</th><th>株高/冠幅</th><th>已有匹配状态</th></tr>'+state.history.map((r,i)=>'<tr class="history-select" data-history="'+i+'"><td><input type="radio" name="history" '+(previous===r.history_row_id?'checked':'')+'></td><td>'+esc(r.history_row_id)+'</td><td>'+esc(r.variety)+'</td><td>'+esc(r.leaf_length_cm)+'</td><td>'+esc(r.leaf_width_cm)+'</td><td>'+esc(r.plant_height_cm)+' / '+esc(r.canopy_width_cm)+'</td><td>'+esc(r.historical_matching_status||'NOT_LINKED')+'</td></tr><tr><td colspan="7"><details><summary>查看 '+esc(r.history_row_id)+' 原始 Excel 行数据</summary><div class="raw-grid">'+raw(r)+'</div></details></td></tr>').join('')+'</table>':'<p class="hint">没有找到同品种历史候选。</p>';
 state.history=state.history.map(r=>({...r,_selected:r.history_row_id===previous}));
 document.querySelectorAll('.history-select').forEach(tr=>{
  tr.onclick=()=>{let i=Number(tr.dataset.history);state.history=state.history.map((r,j)=>({...r,_selected:j===i}));document.querySelectorAll('.history-select').forEach(x=>x.classList.remove('selected'));tr.classList.add('selected');tr.querySelector('input').checked=true;loadMetricCandidates(state.history[i])};
  if(tr.querySelector('input').checked){tr.classList.add('selected');loadMetricCandidates(state.history[Number(tr.dataset.history)])}
 });
}
async function clickPixel(e){let im=$('rgb'),r=im.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*im.naturalWidth,y=(e.clientY-r.top)/r.height*im.naturalHeight;if(x<0||y<0||x>=im.naturalWidth||y>=im.naturalHeight)return;state.clicked={x,y};let c=$('image-canvas').getBoundingClientRect();$('click-dot').style.left=(e.clientX-c.left)+'px';$('click-dot').style.top=(e.clientY-c.top)+'px';$('click-dot').style.display='block';let d=await json(`/api/match/pixel?plant=${encodeURIComponent(state.plant)}&view=${encodeURIComponent(state.view)}&x=${x}&y=${y}`);renderCandidates(d)}
function renderCandidates(d){$('candidates').innerHTML=d.candidates.length?`<b>${esc(d.status)}${d.direct_leaf_id?' · 直接命中 '+esc(d.direct_leaf_id):''}</b>`+d.candidates.map(c=>`<div class="candidate ${c.leaf_id===d.direct_leaf_id?'selected':''}"><b>${esc(c.leaf_id)}</b><br>附近命中 ${c.hits} 次 · 最近 ${c.nearest_distance_px.toFixed(1)} px ${c.direct?'· 直接命中':''}<br><button data-leaf="${esc(c.leaf_id)}">查看此候选</button></div>`).join(''):'<span class="hint">该点击处没有叶片候选，请换一个表面位置或选择未找到对应叶片。';document.querySelectorAll('[data-leaf]').forEach(b=>b.onclick=()=>showLeaf(b.dataset.leaf))}
function selectedHistory(){return state.history?.find(r=>r._selected)||state.history?.find(r=>r.history_row_id===state.config?.row?.history_row_id)||null}
async function save(status,confirmed){let h=selectedHistory(),p={plant_id:state.plant,handwritten_number:String(state.number),leaf_id:state.selectedLeaf,reference_view:state.view,clicked_pixel_x:state.clicked?.x||state.config.row.clicked_pixel_x||'',clicked_pixel_y:state.clicked?.y||state.config.row.clicked_pixel_y||'',match_status:status,human_confirmed:confirmed,history_confirmed:!!h,history_row_id:h?.history_row_id||'',history_source:h?.source||'',history_variety:h?.variety||'',history_excel_row:h?.excel_row||'',manual_leaf_length_cm:h?.leaf_length_cm||'',manual_leaf_width_cm:h?.leaf_width_cm||'',capture_session:$('capture_session').value,measured_at:$('measured_at').value,measurement_tool:$('measurement_tool').value,operator:$('operator').value,notes:$('notes').value};let d=await json('/api/match/confirm?plant='+encodeURIComponent(state.plant),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});$('save-status').textContent=`已保存 ${state.plant} ${state.number}号：${status}${h?'；历史行 '+h.history_row_id:''}`;renderProgress(d.matches);if(status==='confirmed'&&state.number<3){state.number++;await loadPlant()}else await loadView()}
document.querySelectorAll('.number').forEach(b=>b.onclick=()=>{state.number=Number(b.dataset.number);loadView()});$('plant').onchange=()=>{state.plant=$('plant').value;state.number=1;loadPlant()};$('view').onchange=()=>{state.view=$('view').value;loadView()};$('zoom-in').onclick=()=>{state.zoom=Math.min(3,state.zoom+.25);applyZoom()};$('zoom-out').onclick=()=>{state.zoom=Math.max(.5,state.zoom-.25);applyZoom()};$('zoom-reset').onclick=()=>{state.zoom=1;applyZoom()};$('image-stage').onclick=clickPixel;$('confirm').onclick=()=>state.selectedLeaf?save('confirmed',true):($('save-status').textContent='请先选择候选 Leaf_NNN');$('candidate-select').onclick=()=>{$('save-status').textContent='请在候选卡片中选择另一个 Leaf_NNN，然后再次确认。'};$('not-found').onclick=()=>save('not_found',false);$('cancel').onclick=()=>save('cancelled',false);loadPlants().catch(e=>$('save-status').textContent=e.message);
</script>
