<!doctype html><meta charset="utf-8"><title>ForeSplat 人工参考值</title><style>body{font:16px system-ui;background:#f4f7f6;color:#16312b;margin:30px;max-width:1000px}label{display:inline-grid;width:290px;padding:10px}input,select,button{font:inherit;padding:7px}#message{white-space:pre-wrap}a{margin-right:20px}</style>
<h1>人工参考值录入</h1><p>仅配对同一株、同一 Leaf ID、同一次采集的真实实测。没有配对的 MAE、RMSE 和 R² 保持空白。</p><label>植物<select id="plant"></select></label><label>叶片<select id="leaf"></select></label><p><a id="annotation">SAM3 点、框和标志复核</a><a href="/summary/leaf_mesh_index.html">三维索引</a><a id="csv">下载人工参考表</a></p><form id="form"><div id="fields"></div><p><input id="confirmed" type="checkbox">我确认植物、叶片身份和采集时间一致，且以上为真实人工实测。</p><button>保存参考值并更新误差表</button></form><p id="message"></p>
<script>
const el=id=>document.getElementById(id),fields={leaf_length_cm:'叶长 (cm)',leaf_width_cm:'最大叶宽 (cm)',leaf_area_cm2:'单侧叶面积 (cm²)',plant_height_cm:'株高 (cm)',canopy_span_a_cm:'固定轴 A 冠幅 (cm)',canopy_span_b_cm:'固定轴 B 冠幅 (cm)',canopy_width_cm:'最大水平冠幅 (cm)',capture_session:'采集批次/时间',measured_at:'人工测量日期',measurement_tool:'测量工具与方法',operator:'测量人',notes:'备注'};let rows=[];
for(let [key,label] of Object.entries(fields)){let l=document.createElement('label');l.textContent=label;let input=document.createElement('input');input.id=key;if(key.endsWith('_cm')||key.endsWith('_cm2')){input.type='number';input.step='any';input.min='0'}l.append(input);el('fields').append(l)}
function show(){let r=rows.find(r=>r.leaf_id===el('leaf').value)||{};for(let key of Object.keys(fields))el(key).value=r[key]||'';el('confirmed').checked=['true','1','yes'].includes(String(r.pair_confirmed).toLowerCase())}
async function load(){const plant=el('plant').value,r=await fetch('/api/manual?plant='+plant).then(r=>r.json());rows=r.rows;el('leaf').replaceChildren(...rows.map(r=>new Option(r.leaf_id||'整株',r.leaf_id)));el('annotation').href='/annotation?plant='+plant;el('csv').href='/'+plant+'/phenotype/manual_reference.csv';el('message').textContent=r.ready?'参考值将保留版本记录，只有明确确认的真实配对参与误差计算。':'这株尚未完成表型输出，请等待流水线继续。';show()}
el('plant').onchange=load;el('leaf').onchange=show;el('form').onsubmit=async e=>{e.preventDefault();let value={leaf_id:el('leaf').value,pair_confirmed:el('confirmed').checked};for(let key of Object.keys(fields))value[key]=el(key).value;let r=await fetch('/api/manual?plant='+el('plant').value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)}),v=await r.json();el('message').textContent=r.ok?'已保存；有效配对 '+v.audit.verified_pairs+' 条。':v.error};fetch('/api/plants').then(r=>r.json()).then(r=>{for(let p of r.plants)el('plant').add(new Option(p.plant+' · '+p.group+(p.ready?'':' · 运行中'),p.plant));const ready=r.plants.find(p=>p.ready);if(ready)el('plant').value=ready.plant;load()});
</script>
