experiment:
  name: foresplat_default
  description: Foreground-object 2DGS configuration template matching the manuscript workflow.
  train_iterations: 30000
  image_resolution: matched
  random_seed: 2026

data:
  example_sequence: examples/real_subset_kongquezhu
  images: examples/real_subset_kongquezhu/images
  masks: examples/real_subset_kongquezhu/masks

foreground_initialisation:
  use_colmap_tracks: true
  require_mask_consistency: true
  min_visible_views: 2
  foreground_confidence_threshold: 0.55

losses:
  foreground_rgb:
    enabled: true
    weight: 1.0
  alpha_mask:
    enabled: true
    l1_weight: 0.08
    dice_weight: 0.08
  background_opacity:
    enabled: true
    weight: 0.02

view_quality_weighting:
  enabled: true
  config: configs/view_quality_weights.yaml

m2m3_go:
  enabled: true
  config: configs/m2m3_go.yaml

mask_guided_pruning:
  enabled: true
  config: configs/pruning.yaml

metrics:
  - psnr_fg
  - ssim_fg
  - lpips_fg
  - outside_mask_non_black_ratio
  - leakage_energy_ratio

mesh_extraction:
  method: tsdf_style_fusion
  mask_aware_weighting: true
  normal_aware_weighting: true
