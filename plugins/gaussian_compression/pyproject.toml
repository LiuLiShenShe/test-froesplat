# Dependency definition for the standalone post-training pruning plugin.
#
# Managed with uv (conda is not used):
#
#   uv sync
#
# The optional native render evaluation uses the existing frozen 2DGS
# environment; no torch/CUDA installation is needed for the standalone
# PLY pruning API.

[project]
name = "foresplat-gaussian-compression"
version = "0.0.0"
description = "Post-training Gaussian pruning prototype (ForeSplat Phase20G0)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.2",
    "plyfile==1.1.3",
]

[tool.uv]
package = false
